name: Windows x64 build and tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cvs-windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Scientific, configuration and D3D11 WARP tests
        run: ctest --test-dir build -C Release --verbose --output-on-failure --output-junit test-results.xml
      - name: Application UI, global hotkeys, tray and emergency test
        shell: pwsh
        run: |
          $cvsSmokeDir = Join-Path $env:TEMP 'CVS Portable'
          New-Item -ItemType Directory -Force $cvsSmokeDir | Out-Null
          Copy-Item build/Release/ColorVisionSimulator.exe "$cvsSmokeDir/ColorVisionSimulator.exe"
          $cvsProcess = Start-Process "$cvsSmokeDir/ColorVisionSimulator.exe" -ArgumentList '--smoke-test' -PassThru -Wait
          Copy-Item "$env:TEMP/CVS-smoke/diagnostics.log" build/smoke.log -ErrorAction SilentlyContinue
          Copy-Item "$env:TEMP/CVS-smoke/gui.bmp" build/gui.bmp -ErrorAction SilentlyContinue
          if ($cvsProcess.ExitCode -ne 0) { throw "Smoke test failed: $($cvsProcess.ExitCode)" }
      - name: Package portable application and source
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist/ColorVisionSimulator
          git rev-parse HEAD | Out-File dist/ColorVisionSimulator/SOURCE_COMMIT.txt -Encoding ascii
          git archive --format=zip --output=dist/ColorVisionSimulator-source.zip HEAD
          Compress-Archive -Path dist/ColorVisionSimulator -DestinationPath dist/ColorVisionSimulator-win-x64.zip
          Get-FileHash dist/*.zip -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ColorVisionSimulator-win-x64
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            build/smoke.log
            build/gui.bmp
